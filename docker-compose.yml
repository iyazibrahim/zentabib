services:
  web:
    build:
      context: .
      target: deps
    command: npm run dev
    ports:
      - '3025:3025'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    environment:
      - NODE_ENV=development
      - PORT=3025
      - WATCHPACK_POLLING=true
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me}
      - AUTH_SECRET=${AUTH_SECRET:-dev-auth-secret-change-me}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3025}

  web-prod:
    profiles:
      - prod
    build:
      context: .
    ports:
      - '3025:3025'
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - PORT=3025
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
