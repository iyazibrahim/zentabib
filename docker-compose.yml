services:
  web:
    build:
      context: .
      target: deps
    command: npm run dev
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true

  web-prod:
    profiles:
      - prod
    build:
      context: .
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
